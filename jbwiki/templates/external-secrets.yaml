{{- range $es := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $es.name }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: {{ $es.secretStore }}
  target:
    name: {{ $es.targetName }}
    {{- if $es.template }}
    template: 
      type: {{ $es.template.templateType }}
      data:
        {{- toYaml $es.template.data | nindent 8 }}
    {{- end }}
  data:
    {{- toYaml $es.data | nindent 4 }}
{{- end}}