{{- if (not .Values.existingSecret) -}}
{{- $secretName := include "mariadb.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existingSecret -}}
{{- $existingData = $existingSecret.data | default dict -}}
{{- end -}}
{{- $dbPassword := .Values.db.password -}}
{{- if empty $dbPassword -}}
{{- if hasKey $existingData "mariadb-db-password" -}}
{{- $dbPassword = index $existingData "mariadb-db-password" | b64dec -}}
{{- else if hasKey $existingData "mariadb-password" -}}
{{- $dbPassword = index $existingData "mariadb-password" | b64dec -}}
{{- else if not .Values.db.forcePassword -}}
{{- $dbPassword = randAlphaNum 10 -}}
{{- else -}}
{{- $dbPassword = required "A MariaDB Database Password is required!" .Values.db.password -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "mariadb.fullname" . }}
  labels:
    app: "{{ template "mariadb.name" . }}"
    chart: "{{ template "mariadb.chart" . }}"
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  {{- if not (empty .Values.rootUser.password) }}
  mariadb-root-password: "{{ .Values.rootUser.password | b64enc }}"
  {{- else if hasKey $existingData "mariadb-root-password" }}
  mariadb-root-password: {{ index $existingData "mariadb-root-password" | quote }}
  {{- else if (not .Values.rootUser.forcePassword) }}
  mariadb-root-password: "{{ randAlphaNum 10 | b64enc }}"
  {{ else }}
  mariadb-root-password: {{ required "A MariaDB Root Password is required!" .Values.rootUser.password }}
  {{- end }}
  {{- if not (empty .Values.db.user) }}
  mariadb-db-user: "{{ .Values.db.user | b64enc }}"
  mariadb-db-password: "{{ $dbPassword | b64enc }}"
  mariadb-password: "{{ $dbPassword | b64enc }}"
  mariadb-db: "{{ .Values.db.name | b64enc }}"
  {{- end }}
{{- end }}
